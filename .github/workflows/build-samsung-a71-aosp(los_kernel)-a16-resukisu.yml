name: Build Samsung Galaxy A71 (AOSP A16) (KernelSU Only)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "samsung_a71"
  DEVICE_CODENAME : "a71"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++"

  KERNEL_SOURCE : "https://github.com/LineageOS/android_kernel_samsung_a71.git"
  KERNEL_BRANCH : "lineage-23.2"

  CLANG_SOURCE : "https://github.com/nduykha/kernel_samsung_sm7150/releases/download/clang/llvm.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : true
  GCC_64_SOURCE : "https://github.com/nduykha/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.git"
  GCC_64_BRANCH : "main"
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "a71_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # KernelSU Settings
  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu" # Bản KernelSU ổn định cho Non-GKI
  KERNELSU_METHOD: "shell"

  # Disable SUSFS to avoid build errors
  SUSFS_ENABLE : false
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "aosp_a16"

  # Other env
  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  PATCHES_SOURCE: "nduykha/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "samsung_kernel"

  REKERNEL_ENABLE: "true"
  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  BASEBAND_GUARD_ENABLE: "false" # Tắt tạm thời để đảm bảo boot thành công
  HIDE_STUFF: "false" # Tắt để tránh xung đột với KernelSU nguyên bản

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"
  BUILD_DEBUGGER: "true" # Bật để xem log nếu lỗi
  SKIP_PATCH: "false"

jobs:
  build-kernel:
    name: Build Samsung Galaxy A71 (KernelSU)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      # Bỏ qua bước Patch SUSFS

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options & KernelSU Fixes
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          # 1. Cập nhật tên Kernel
          sed -i 's/CONFIG_LOCALVERSION="-lineage-23.2"/CONFIG_LOCALVERSION="-HaoticKernel-KSU"/g' arch/arm64/configs/a71_defconfig
          
          # 2. Fix lỗi thiếu định nghĩa PID cho KernelSU trên Kernel cũ (4.14)
          # Lỗi này rất thường gặp khi build KernelSU cho Samsung SM7150
          if [ -d "drivers/kernelsu" ]; then
            find drivers/kernelsu -type f -name "*.c" -exec sed -i 's/pids\[PIDTYPE_PID\].pid/thread_pid/g' {} +
          fi

          # 3. Loại bỏ các config trùng lặp
          sed -i '/CONFIG_DEBUG_KERNEL/d' arch/arm64/configs/a71_defconfig
          sed -i '/CONFIG_KALLSYMS/d' arch/arm64/configs/a71_defconfig
          sed -i '/CONFIG_DEVTMPFS/d' arch/arm64/configs/a71_defconfig

          # 4. Inject Docker & KSU configs
          cat <<EOF >> arch/arm64/configs/a71_defconfig
          # KernelSU Configuration
          CONFIG_KPROBES=n
          CONFIG_HAVE_KPROBES=n
          CONFIG_KPROBE_EVENTS=n

          # Debug & Core
          CONFIG_DEBUG_KERNEL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y

          # Devtmpfs
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y

          # Docker & Namespaces
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_USER_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_OVERLAY_FS=y
          EOF

          echo "[+] KernelSU fixes and Docker configs injected."

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
