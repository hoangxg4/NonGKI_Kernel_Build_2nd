name: Build Samsung Galaxy A71 (LineageOS 23.2 Kernel) (KSU + SUSFS)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "samsung_a71"
  DEVICE_CODENAME : "a71"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++"

  # SỬ DỤNG KERNEL GỐC LINEAGEOS
  KERNEL_SOURCE : "https://github.com/LineageOS/android_kernel_samsung_a71.git"
  KERNEL_BRANCH : "lineage-23.2"

  CLANG_SOURCE : "https://github.com/nduykha/kernel_samsung_sm7150/releases/download/clang/llvm.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : true
  GCC_64_SOURCE : "https://github.com/nduykha/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.git"
  GCC_64_BRANCH : "main"

  DEFCONFIG_NAME : "a71_defconfig"

  # KernelSU & SUSFS Settings
  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu" 
  KERNELSU_METHOD: "shell"

  SUSFS_ENABLE : true
  SUSFS_FIXED : true
  SUSFS_FOLDER_FIXED: "a71_sm7150/resukisu/AOSP"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  ROM_TEXT : "los_a16_ksu_susfs"

  # Patches bổ trợ
  PATCHES_SOURCE: "nduykha/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "samsung_kernel"

  REKERNEL_ENABLE: "true"
  HOOK_METHOD: "syscall"
  
  BASEBAND_GUARD_ENABLE: "true"
  HIDE_STUFF: "true"

  # Thiết lập Python cho script build
  PYTHON_VERSION: "3.10"

jobs:
  build-kernel:
    name: Build LineageOS Kernel (A71)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🛠️ Manual Fix for LineageOS & SUSFS
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          # 1. Ép header để sửa lỗi 'undeclared' do patch bị reject
          sed -i '1i #include <linux/susfs.h>' fs/namespace.c
          sed -i '1i #include <linux/ksu.h>' fs/namespace.c
          sed -i '1i #include <linux/susfs.h>' fs/open.c

          # 2. Định nghĩa Flags bị thiếu trong mount.h
          if ! grep -q "VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT" include/linux/mount.h; then
            echo "#define VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT 0x01000000" >> include/linux/mount.h
          fi

          # 3. Định nghĩa các ID mặc định cho KernelSU
          sed -i '/#include <linux/ksu.h>/a #define DEFAULT_KSU_MNT_ID 10000\n#define DEFAULT_KSU_MNT_GROUP_ID 20000' fs/namespace.c

          # 4. Sửa lỗi PID cho Kernel 4.14 Samsung SM7150
          find drivers/kernelsu -type f -name "*.c" -exec sed -i 's/pids\[PIDTYPE_PID\].pid/thread_pid/g' {} +
          if [ -d "drivers/kernelsu/kpm" ]; then
             sed -i 's/pids\[PIDTYPE_PID\].pid/thread_pid/g' drivers/kernelsu/kpm/super_access.c
          fi

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          # Cập nhật tên Kernel
          sed -i 's/CONFIG_LOCALVERSION="-lineage-23.2"/CONFIG_LOCALVERSION="-Haotic-LOS"/g' arch/arm64/configs/a71_defconfig
          
          # Chỉ giữ lại các config tối thiểu cho KSU/SUSFS
          sed -i '/CONFIG_KALLSYMS/d' arch/arm64/configs/a71_defconfig
          
          cat <<EOF >> arch/arm64/configs/a71_defconfig
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_OVERLAY_FS=y
          EOF

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🔧 Patch Hide Stuff
        uses: ./.github/workflows/patch-hide-stuff

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
