name: Build Samsung Galaxy A71 (LineageOS + SUSFS Fix)

on:
  workflow_dispatch:

env:
  DEVICE_NAME : "samsung_a71"
  DEVICE_CODENAME : "a71"
  KERNEL_SOURCE : "https://github.com/LineageOS/android_kernel_samsung_a71"
  KERNEL_BRANCH : "lineage-21.0" # Nhánh ổn định nhất hiện tại
  DEFCONFIG_NAME : "a71_defconfig"
  
  # Giữ nguyên các cấu hình Tools của bạn
  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++"
  CLANG_SOURCE : "https://github.com/nduykha/kernel_samsung_sm7150/releases/download/clang/llvm.tar.xz"
  GCC_GNU : true
  GCC_64_SOURCE : "https://github.com/nduykha/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.git"
  GCC_64_BRANCH : "main"

  # Cấu hình Root & SUSFS
  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu"
  SUSFS_ENABLE : true
  SUSFS_FIXED : true
  REKERNEL_ENABLE: "true"
  
  # Các thông số Patch
  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "samsung_kernel"
  SUSFS_FOLDER_FIXED: "a71_sm7150/resukisu/AOSP"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"
  BUILD_OTHER_CONFIG: "false"

jobs:
  build-kernel:
    name: Build A71 Kernel with SUSFS
    runs-on: ubuntu-latest
    steps:
      - name: ⏰ Checkout
        uses: actions/checkout@v6

      - name: ⌛️ Env Prep
        uses: ./.github/workflows/build-env

      - name: ⚙️ Tools Ready
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Fix SUSFS Compilation Errors
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          echo "[!] Fixing fs/namespace.c for LineageOS..."
          # Chèn các định nghĩa bị thiếu vào đầu file namespace.c nếu chưa có
          sed -i '/#include <linux\/mount.h>/a #include <linux/susfs.h>\n#include <linux/kernel_stat.h>' fs/namespace.c
          
          # Sửa lỗi thiếu định nghĩa biến trong namespace.c bằng cách ép thêm vào header mount.h
          # Đây là nơi quan trọng nhất để fix lỗi "undeclared identifier"
          sed -i '/struct vfsmap;/a extern int susfs_is_current_ksu_domain(void);\n#define DEFAULT_KSU_MNT_ID 1000000\n#define DEFAULT_KSU_MNT_GROUP_ID 1000000\n#define VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT 0x01000000' include/linux/mount.h

          echo "[!] Fixing fs/open.c..."
          sed -i '/#include <linux\/falloc.h>/a #include <linux/susfs.h>' fs/open.c

          echo "[!] Updating Defconfig..."
          sed -i 's/CONFIG_LOCALVERSION="-.*"/CONFIG_LOCALVERSION="-Haotic-SUSFS"/g' arch/arm64/configs/a71_defconfig
          {
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "CONFIG_SUSFS=y"
          } >> arch/arm64/configs/a71_defconfig

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
