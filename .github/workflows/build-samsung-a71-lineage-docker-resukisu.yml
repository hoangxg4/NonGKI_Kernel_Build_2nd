name: Build Samsung Galaxy A71 (Lineage-Docker) (ReSukiSU)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "samsung_a71"
  DEVICE_CODENAME : "a71"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++"

  # Nguồn Kernel LineageOS 23.2
  KERNEL_SOURCE : "https://github.com/LineageOS/android_kernel_samsung_a71"
  KERNEL_BRANCH : "lineage-23.2"

  CLANG_SOURCE : "https://github.com/nduykha/kernel_samsung_sm7150/releases/download/clang/llvm.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : true
  GCC_64_SOURCE : "https://github.com/nduykha/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.git"
  GCC_64_BRANCH : "main"
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_NAME : "a71_defconfig"
  DEFCONFIG_SOURCE: ""
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu"

  SUSFS_ENABLE : true
  SUSFS_FIXED : true

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  # Tên file zip sau khi build xong
  ROM_TEXT : "Lineage-A16-Docker-ReSukiSU"

  # Other env
  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"
  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "samsung_kernel"
  SUSFS_FOLDER_FIXED: "a71_sm7150/resukisu"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "true"
  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "true"
  KPM_INLINE: "true"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "true"
  BASEBAND_GUARD_BOOT: "false"
  HIDE_STUFF: "true"
  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"
  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Build Samsung Galaxy A71 (Lineage-Docker) (ReSukiSU)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          echo "[!] Applying Smart Deadlock Shield & Docker Optimization..."

          # 1. SMART DEADLOCK SHIELD (Fix CPU 100% khi chạy Systemd trong Droidspaces)
          # Bản vá này phá vỡ vòng lặp Mount Lock khi Systemd/Docker thực hiện mount namespace.
          # PF_KTHREAD check giúp phân biệt tiến trình hệ thống và tiến trình container.
          if [ -f fs/namespace.c ]; then
            sed -i 's/if (mnt->mnt.mnt_flags & MNT_LOCKED)/if ((mnt->mnt.mnt_flags \& MNT_LOCKED) \&\& !(current->flags \& PF_KTHREAD) \&\& !susfs_is_current_ksu_domain())/g' fs/namespace.c
          fi

          # 2. CGROUP V2 UNLOCK (Cần thiết cho Systemd khởi động dịch vụ)
          # Một số bản kernel chặn ghi vào default cgroup từ namespace, lệnh này gỡ bỏ giới hạn đó.
          if [ -f kernel/cgroup/cgroup.c ]; then
            sed -i 's/if (cgroup_on_dfl(cgrp))/if (false)/g' kernel/cgroup/cgroup.c
          fi

          # 3. OVERLAY2 PERMISSION FIX (Cho phép mount container trực tiếp trên /data)
          if [ -f fs/overlayfs/super.c ]; then
            sed -i 's/if (sb->s_user_ns != \&init_user_ns)/if (false \&\& sb->s_user_ns != \&init_user_ns)/g' fs/overlayfs/super.c
          fi
          
          # --- SUSFS HARD-FIX CHO LINEAGEOS ---
          # Chèn Header vào dòng đầu tiên để tránh lỗi biên dịch do Patch SUSFS Failed.
          sed -i '1i #include <linux/susfs.h>\n#include <linux/kernel_stat.h>\n#include <linux/module.h>\n#include <linux/jump_label.h>\n#define DEFAULT_KSU_MNT_ID 1000000\n#define DEFAULT_KSU_MNT_GROUP_ID 1000000\n#define VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT 0x01000000\n#define CL_COPY_MNT_NS 0x01\nextern int susfs_is_current_ksu_domain(void);\nextern struct static_key_false susfs_is_sdcard_android_data_not_decrypted;' fs/namespace.c
          sed -i '1i #include <linux/susfs.h>' fs/open.c
          sed -i '1i #include <linux/susfs.h>' fs/proc/task_mmu.c

          # --- UPDATE KERNEL NAME & KPM FIX CHO LINEAGE ---
          sed -i 's/CONFIG_LOCALVERSION="-.*"/CONFIG_LOCALVERSION="-Haotic-SmartShield"/g' arch/arm64/configs/a71_defconfig
          if [ -f drivers/kernelsu/kpm/super_access.c ]; then
            sed -i 's/thread_pid/pids\[PIDTYPE_PID\].pid/g' drivers/kernelsu/kpm/super_access.c
          fi
          
          # --- INJECT DOCKER & SYSTEMD CORE CONFIGS ---
          # Xóa các config cũ để tránh bị ghi đè sai.
          sed -i '/CONFIG_DEVTMPFS/d' arch/arm64/configs/a71_defconfig
          sed -i '/CONFIG_NAMESPACES/d' arch/arm64/configs/a71_defconfig
          sed -i '/CONFIG_CGROUPS/d' arch/arm64/configs/a71_defconfig
          sed -i '/CONFIG_OVERLAY_FS/d' arch/arm64/configs/a71_defconfig

          cat <<EOF >> arch/arm64/configs/a71_defconfig
          # Debug & Root
          CONFIG_DEBUG_KERNEL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_SUSFS=y

          # Docker Core - Devtmpfs & Namespaces
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_NAMESPACES=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_POSIX_MQUEUE=y

          # Docker - Cgroups V1/V2
          CONFIG_CGROUPS=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CPUSETS=y
          CONFIG_PROC_PID_CPUSET=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_PAGE_COUNTER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_BLK_CGROUP=y
          CONFIG_CGROUP_PERF=y

          # Docker - Networking
          CONFIG_IP_VS=y
          CONFIG_IP_VS_RR=y
          CONFIG_IP_VS_NFCT=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_VETH=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_ANDROID_PARANOID_NETWORK=n
          CONFIG_IP_NF_NAT=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y

          # Docker - Filesystem
          CONFIG_OVERLAY_FS=y
          CONFIG_OVERLAY_FS_REDIRECT_DIR=y
          CONFIG_OVERLAY_FS_INDEX=y
          CONFIG_EXT4_FS_POSIX_ACL=y
          CONFIG_EXT4_FS_SECURITY=y
          EOF

          echo "[+] Smart Shield and Docker Suite injected successfully."

      - name: 🔍 Debug Kernel Source
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "==== SMART SHIELD CHECK ===="
          grep "PF_KTHREAD" fs/namespace.c
          echo "==== DOCKER CONFIG CHECK ===="
          grep -E "CONFIG_NAMESPACES|CONFIG_OVERLAY_FS|CONFIG_CGROUPS|CONFIG_USER_NS" arch/arm64/configs/a71_defconfig

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🔧 Patch Hide Stuff
        uses: ./.github/workflows/patch-hide-stuff

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
